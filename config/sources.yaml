sources:
  - name: "nine.com.au"
    module: "nine_com_au"
    base_url: "https://www.nine.com.au"
    front_pages:
      - slug: "home"
        path: "/"
      - slug: "australia-news"
        path: "/australia-news"
      - slug: "world-news"
        path: "/world-news"
      - slug: "business-news"
        path: "/business-news"
      - slug: "sport"
        path: "/sport"
      - slug: "entertainment"
        path: "/entertainment"
      - slug: "lifestyle"
        path: "/lifestyle"
  - name: "ABC News"
    module: "abc_net_au"
    base_url: "https://www.abc.net.au"
    front_pages:
      - slug: "home"
        path: "/"
  - name: "Al Jazeera"
    module: "aljazeera"
    base_url: "https://www.aljazeera.com"
    front_pages:
      - slug: "home"
        path: "/"
  - name: "news.com.au"
    module: "news_com_au"
    base_url: "https://www.news.com.au"
    front_pages:
      - slug: "home"
        path: "/"
  - name: "China News"
    module: "chinanews"
    base_url: "https://www.chinanews.com.cn"
    # Every other source defaults to "en" (see run_batch.py's translate_article,
    # which only loads nlp/translate.py's model at all if some configured
    # source declares a non-"en" language) - this is the first source that
    # needs the field set.
    language: "zh"
    front_pages:
      - slug: "home"
        path: "/"
