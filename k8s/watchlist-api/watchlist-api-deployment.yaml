apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchlist-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchlist-api
  template:
    metadata:
      labels:
        app: watchlist-api
    spec:
      containers:
        - name: watchlist-api
          image: myopic-api:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: myopic-db-config
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
