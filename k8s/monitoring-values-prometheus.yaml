# Lean prometheus-community/prometheus install (no Operator, no alerting) -
# this cluster is memory-constrained (minikube capped at 6GiB), so we skip
# alertmanager/pushgateway and keep component resources modest.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistentVolume:
    enabled: true
    size: 2Gi
  retention: "7d"

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
