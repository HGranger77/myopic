# Template holding BOTH Grafana datasources together (Helm doesn't merge
# YAML lists across -f files, so Prometheus + Postgres must stay in one
# file). The real file (k8s/monitoring/grafana-secret-values.yaml) is
# gitignored since it holds a DB password.
#
# Generate the real file with:
#
#   ./scripts/generate-grafana-secret.sh
#
# (that script's own comments explain each field below; this template
# mirrors its output, shown here as a flat comment block rather than a
# runnable heredoc since the script is now the source of truth)
#   datasources:
#     datasources.yaml:
#       apiVersion: 1
#       datasources:
#         - name: Prometheus
#           uid: myopic-prometheus
#           type: prometheus
#           access: proxy
#           url: http://prometheus-server.monitoring.svc.cluster.local
#           isDefault: true
#         - name: Postgres
#           uid: myopic-postgres
#           type: postgres
#           access: proxy
#           url: postgres.default.svc.cluster.local:5432
#           database: \$POSTGRES_DB
#           user: \$POSTGRES_USER
#           secureJsonData:
#             password: \$POSTGRES_PASSWORD
#           # database is set both top-level (what the backend actually
#           # connects with) and again in jsonData (what the grafana-
#           # postgresql-datasource query editor's frontend checks before
#           # letting a query run at all - without it every panel fails
#           # client-side with "you do not currently have a default
#           # database configured", even though the backend connects fine).
#           jsonData:
#             sslmode: disable
#             postgresVersion: 1600
#             database: \$POSTGRES_DB
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: myopic-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
      - name: Postgres
        uid: myopic-postgres
        type: postgres
        access: proxy
        url: postgres.default.svc.cluster.local:5432
        database: myopic
        user: myopic
        secureJsonData:
          password: change-me
        jsonData:
          sslmode: disable
          postgresVersion: 1600
          database: myopic
